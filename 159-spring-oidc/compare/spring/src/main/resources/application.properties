spring.application.name=trailclub
server.port=8091
# The club's OpenID Connect provider: Spring reads the rest from its discovery document.
spring.security.oauth2.client.registration.club.client-id=trail-spring
spring.security.oauth2.client.registration.club.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.club.scope=openid,profile
spring.security.oauth2.client.provider.club.issuer-uri=http://localhost:4000
