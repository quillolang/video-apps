[package]
name = "guestbook-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
